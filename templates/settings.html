{% extends 'base/base.html' %}
{% load static %}

{% block body %}

    <div class="container settings-container" style="margin-top: 32px;">
        <div class="row">


            <style>
                .sidebar-modern {
                    background: var(--surface);
                    border-radius: var(--radius-md);
                    box-shadow: var(--shadow-md);
                    overflow: hidden;
                    position: sticky;
                    top: 20px;
                }

                .user-profile-modern {
                    background: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-600) 100%);
                    padding: var(--space-6) var(--space-4);
                    text-align: center;
                    position: relative;
                }

                .user-profile-modern::before {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
                    opacity: 0.4;
                }

                .user-avatar-modern {
                    width: 100px;
                    height: 100px;
                    border-radius: 50%;
                    border: 4px solid var(--surface);
                    box-shadow: var(--shadow-md);
                    object-fit: cover;
                    position: relative;
                    z-index: 1;
                }

                .user-info-modern {
                    color: white;
                    margin-top: var(--space-4);
                    position: relative;
                    z-index: 1;
                }

                .user-info-modern h6 {
                    font-size: 18px;
                    font-weight: 700;
                    margin-bottom: var(--space-2);
                }

                .user-info-modern p {
                    font-size: 14px;
                    opacity: 0.95;
                    margin-bottom: var(--space-1);
                }

                .nav-modern {
                    padding: var(--space-2) 0;
                }

                .nav-modern .nav-item {
                    margin: 0;
                }

                .nav-modern .nav-link {
                    color: var(--ink-muted);
                    padding: var(--space-3) var(--space-5);
                    display: flex;
                    align-items: center;
                    font-weight: 500;
                    font-size: 14px;
                    border-left: 3px solid transparent;
                    transition: all 0.3s ease;
                }

                .nav-modern .nav-link i {
                    font-size: 20px;
                    margin-right: var(--space-3);
                    width: 24px;
                    text-align: center;
                }

                .nav-modern .nav-link:hover,
                .nav-modern .nav-link.active {
                    background: linear-gradient(90deg, rgba(var(--brand-500-rgb), 0.08) 0%, transparent 100%);
                    color: var(--brand-500);
                    border-left-color: var(--brand-500);
                }

                @media (max-width: 768px) {
                    .sidebar-modern {
                        margin-bottom: var(--space-4);
                        position: static;
                    }

                    .user-profile-modern {
                        padding: var(--space-4) var(--space-4);
                    }

                    .user-avatar-modern {
                        width: 80px;
                        height: 80px;
                    }

                    .user-info-modern h6 {
                        font-size: 16px;
                    }

                    .user-info-modern p {
                        font-size: 12px;
                    }

                    .nav-modern .nav-link {
                        padding: var(--space-3) var(--space-4);
                        font-size: 14px;
                    }

                    .nav-modern .nav-link i {
                        font-size: 18px;
                        margin-right: var(--space-2);
                    }
                }

                .settings-card {
                    background: var(--surface);
                    border-radius: var(--radius-md);
                    box-shadow: var(--shadow-md);
                    padding: var(--space-6);
                }

                .settings-header {
                    margin-bottom: var(--space-5);
                    padding-bottom: var(--space-4);
                    border-bottom: 1px solid var(--surface-2);
                }

                .settings-header h3 {
                    font-size: 20px;
                    font-weight: 700;
                    color: var(--ink);
                    margin-bottom: var(--space-1);
                }

                .settings-header p {
                    color: var(--ink-muted);
                    font-size: 14px;
                    margin: 0;
                }

                .settings-card .form-group {
                    margin-bottom: var(--space-4);
                }

                .settings-card label {
                    font-weight: 600;
                    font-size: 14px;
                    color: var(--ink-body);
                    margin-bottom: var(--space-2);
                    display: block;
                }

                .settings-card .form-control {
                    border-radius: var(--radius-md);
                    border: 1px solid var(--border);
                    padding: var(--space-3) var(--space-4);
                    font-size: 14px;
                }

                .settings-card .form-control:focus {
                    border-color: var(--brand-500);
                    box-shadow: 0 0 0 3px rgba(var(--brand-500-rgb), 0.1);
                }

                .btn-save {
                    background: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-600) 100%);
                    color: white;
                    border: 1px solid transparent;
                    border-radius: var(--radius-md);
                    height: 40px;
                    padding: 0 var(--space-5);
                    font-weight: 600;
                    font-size: 14px;
                    display: inline-flex;
                    align-items: center;
                    gap: var(--space-2);
                    cursor: pointer;
                    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
                }

                .btn-save:hover {
                    color: white;
                    opacity: 0.9;
                }

                .btn-save:focus-visible {
                    outline: 2px solid var(--brand-500);
                    outline-offset: 2px;
                }

                .btn-save:disabled {
                    opacity: .6;
                    cursor: not-allowed;
                }
            </style>
            {% include 'base/sidebar.html' %}
            <div class="col-md-9">


                <!-- Profil ma'lumotlari -->
                <div class="settings-card mb-4">
                    <div class="settings-header">
                        <h3>Sozlamalar</h3>
                        <p>Profil ma'lumotlaringizni tahrirlang</p>
                    </div>

                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="id_first_name">Ism</label>
                                    <input type="text" name="first_name" id="id_first_name"
                                           class="form-control "
                                           value="{{ user.first_name }}">

                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="id_last_name">Familiya</label>
                                    <input type="text" name="last_name" id="id_last_name"
                                           class="form-control "
                                           value="{{ user.last_name }}">

                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="id_region">Viloyat</label>
                                    <select name="region" id="id_region"
                                            class="form-control " style="padding: 8px 16px; min-height: 45px;">
                                        <option value="">Viloyatni tanlang</option>
                                        {% for region in regions %}
                                            <option value="{{ region.id }}"
                                                    {% if user.region.id == region.id %}selected{% endif %}>
                                                {{ region.title }}
                                            </option>
                                        {% endfor %}


                                    </select>

                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="id_district">Tuman / Shahar</label>
                                    <select name="city" id="id_district" class="form-control"
                                            style="padding: 8px 16px; min-height: 45px;">
                                        <option value="">Tumanni tanlang</option>
                                        {% for district in districts %}
                                            <option value="{{ district.title }}"
                                                    {% if user.district.id == district.id %}selected{% endif %}>
                                                {{ district.title }}
                                            </option>
                                        {% endfor %}
                                    </select>

                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="id_telegram_id">Telegram ID</label>
                            <input type="text" name="telegram_id" id="id_telegram_id"
                                   class="form-control" value="{{ user.telegram_id|default:'' }}">
                        </div>

                        <div class="form-group">
                            <label for="id_description">Haqida</label>
                            <textarea name="description" id="id_description" rows="3"
                                      class="form-control">{{ user.bio|default:'' }}</textarea>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-save">
                                <i class="icofont-save"></i> Saqlash
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Parol almashtirish -->
                <div class="settings-card">
                    <div class="settings-header">
                        <h3>Parolni o'zgartirish</h3>
                        <p>Hisobingiz xavfsizligi uchun parolni muntazam yangilang</p>
                    </div>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        <input type="hidden" name="_password_change" value="1">

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="id_new_password">Yangi parol</label>
                                    <input type="password" name="new_password" id="id_new_password"
                                           class="form-control" placeholder="Yangi parol (kamida 6 belgi)">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="id_confirm_password">Yangi parolni tasdiqlang</label>
                                    <input type="password" name="confirm_password" id="id_confirm_password"
                                           class="form-control" placeholder="Yangi parolni qayta kiriting">
                                </div>
                            </div>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-save">
                                <i class="icofont-key"></i> Parolni o'zgartirish
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const regionSelect = document.getElementById('id_region');
            const districtSelect = document.getElementById('id_district');
            const currentCity = "{{ user.district.title|default:'' }}";

            regionSelect.addEventListener('change', function () {
                const regionId = this.value;
                districtSelect.innerHTML = '<option value="">Yuklanmoqda...</option>';

                if (!regionId) {
                    districtSelect.innerHTML = '<option value="">Tumanni tanlang</option>';
                    return;
                }

                fetch(`/get-districts/${regionId}/`)
                    .then(res => res.json())
                    .then(data => {
                        districtSelect.innerHTML = '<option value="">Tumanni tanlang</option>';
                        data.districts.forEach(function (d) {
                            const opt = document.createElement('option');
                            opt.value = d.name;
                            opt.textContent = d.name;
                            if (d.name === currentCity) {
                                opt.selected = true;
                            }
                            districtSelect.appendChild(opt);
                        });
                    })
                    .catch(() => {
                        districtSelect.innerHTML = '<option value="">Xatolik yuz berdi</option>';
                    });
            });
        });
    </script>

{% endblock %}
