{% extends 'base/base.html' %}
{% load static %}
<style>
    .category-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--surface);
        padding: var(--space-5);
        border-radius: var(--radius-md);
        text-decoration: none;
        color: var(--ink-body);
        box-shadow: var(--shadow-sm);
        transition: transform 0.3s ease;
    }

    .category-card:hover {
        transform: translateY(-5px);
        color: var(--brand-500);
    }

    .category-image-wrapper {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--surface-2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: var(--space-4);
    }

    .category-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .category-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
    }

    .product-card {
        background: var(--surface);
        border-radius: var(--radius-md);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        transition: transform 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .product-card:hover {
        transform: translateY(-5px);
    }

    .product-image-wrapper {
        width: 100%;
        height: 200px;
        overflow: hidden;
    }

    .product-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .product-info {
        padding: var(--space-4);
    }

    .product-title a {
        text-decoration: none;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
    }

    .product-price {
        color: var(--brand-500);
        font-weight: 700;
        font-size: 18px;
        margin-top: var(--space-3);
        margin-bottom: 0;
    }
</style>

{% block body %}

    <section class="categories-section py-4">
        <div class="container">
            <div class="row g-3">

                {% for category in categories %}

                    <div class="col-4 col-md-4 col-lg-3">
                        <a href="{% url 'category_detail' category.slug %}" class="category-card">
                            <div class="category-image-wrapper">
                                <img class="category-image"
                                     src="{{ category.image.url }}"
                                     alt="{{ category.title }}">
                            </div>
                            <h6 class="category-title">{{ category.title }}</h6>
                        </a>
                    </div>

                {% endfor %}


            </div>
        </div>
    </section>

    <section class="products-section py-5 bg-light">
        <div class="container">
            <div class="section-header mb-4">
                <h2 class="section-title">Eng ko'p sotiladigan</h2>
                <a href="/category" class="view-all-link">
                    Barchasini ko'rish
                    <i class="icofont-rounded-right"></i>
                </a>
            </div>

            <div class="row g-4">
                {% for product in products %}
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="product-card">
                            <a href="/product-detail/{{ product.slug }}"
                               class="product-image-link">
                                <div class="product-image-wrapper">
                                    <img class="product-image"
                                         src="{{ product.image.url }}"
                                         alt="{{ product.title }}"
                                         loading="lazy">
                                </div>
                            </a>
                            <div class="product-info">
                                <h6 class="product-title">
                                    <a href="/product-detail/{{ product.slug }}">
                                        {{ product.title }}
                                    </a>
                                </h6>
                                <p class="product-price">{{ product.price }} so'm</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}


            </div>
        </div>
    </section>


{% endblock %}
