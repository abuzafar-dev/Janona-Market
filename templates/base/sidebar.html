{% load static %}

<style>
    .sidebar-modern {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        position: sticky;
        top: 20px;
    }

    .user-profile-modern {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 30px 20px;
        text-align: center;
        position: relative;
    }

    .user-profile-modern::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        opacity: 0.4;
    }

    .user-avatar-modern {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 4px solid white;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        object-fit: cover;
        position: relative;
        z-index: 1;
    }

    .user-info-modern {
        color: white;
        margin-top: 15px;
        position: relative;
        z-index: 1;
    }

    .user-info-modern h6 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .user-info-modern p {
        font-size: 13px;
        opacity: 0.95;
        margin-bottom: 4px;
    }

    .nav-modern {
        padding: 10px 0;
    }

    .nav-modern .nav-item {
        margin: 0;
    }

    .nav-modern .nav-link {
        color: #64748b;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        font-weight: 500;
        font-size: 15px;
        border-left: 3px solid transparent;
        transition: all 0.3s ease;
    }

    .nav-modern .nav-link i {
        font-size: 20px;
        margin-right: 12px;
        width: 24px;
        text-align: center;
    }

    .nav-modern .nav-link:hover,
    .nav-modern .nav-link.active {
        background: linear-gradient(90deg, rgba(102, 126, 234, 0.08) 0%, transparent 100%);
        color: #667eea;
        border-left-color: #667eea;
    }

    @media (max-width: 768px) {
        .sidebar-modern {
            margin-bottom: 20px;
            position: static;
        }

        .user-profile-modern {
            padding: 20px 15px;
        }

        .user-avatar-modern {
            width: 80px;
            height: 80px;
        }

        .user-info-modern h6 {
            font-size: 16px;
        }

        .user-info-modern p {
            font-size: 12px;
        }

        .nav-modern .nav-link {
            padding: 12px 20px;
            font-size: 14px;
        }

        .nav-modern .nav-link i {
            font-size: 18px;
            margin-right: 10px;
        }
    }
</style>
<div class="col-md-3 mb-4">
    <div class="sidebar-modern">
        <div class="user-profile-modern">
            <img class="user-avatar-modern" src="{% static 'apps/icons8-profile-94.png' %}" alt="">
            <div class="user-info-modern">
                <h6>{{ user.first_name|default:'' }} {{ user.last_name|default:'' }}</h6>
                <p>{{ user.phone_number }}</p>
                <p>{{ user.bio|default:'' }}</p>
            </div>
        </div>
        <ul class="nav nav-modern flex-column" id="myTab" role="tablist">

            <li class="nav-item">
                <a href="/admin_page"
                   class="nav-link {% if request.path == '/admin_page' or request.path == '/admin_page/' %}active{% endif %}">
                    <i class="icofont-ui-user"></i>
                    <span>Mening kabinetim</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/admin_page/market"
                   class="nav-link {% if '/admin_page/market' in request.path %}active{% endif %}">
                    <i class="icofont-shopping-cart"></i>
                    <span>Market</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/admin_page/requests"
                   class="nav-link {% if '/admin_page/requests' in request.path %}active{% endif %}">
                    <i class="icofont-list"></i>
                    <span>So'rovnomalar</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="{% url 'links' %}"
                   class="nav-link {% if '/admin_page/links' in request.path %}active{% endif %}">
                    <i class="icofont-link"></i>
                    <span>Havolalar</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/admin_page/stats"
                   class="nav-link {% if '/admin_page/stats' in request.path %}active{% endif %}">
                    <i class="icofont-chart-bar-graph"></i>
                    <span>Statistika</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/admin_page/competition"
                   class="nav-link {% if '/admin_page/competition' in request.path %}active{% endif %}">
                    <i class="icofont-trophy-alt"></i>
                    <span>Konkurs</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/admin_page/withdraw"
                   class="nav-link {% if '/admin_page/withdraw' in request.path %}active{% endif %}">
                    <i class="icofont-money"></i>
                    <span>To'lov</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/profile/referral"
                   class="nav-link {% if '/profile/referral' in request.path %}active{% endif %}">
                    <i class="icofont-users-alt-4"></i>
                    <span>Referal</span>
                </a>
            </li>

            <li class="nav-item">
                <a href="/profile/settings"
                   class="nav-link {% if '/profile/settings' in request.path %}active{% endif %}">
                    <i class="icofont-ui-settings"></i>
                    <span>Sozlamalar</span>
                </a>
            </li>
        </ul>
    </div>
</div>
